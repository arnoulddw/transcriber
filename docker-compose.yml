# ./docker-compose.yml
# Defines Docker services, networks, and volumes for easy deployment.
# Works without a .env file: `docker compose up -d` starts a personal instance
# with local-only database credentials and a SECRET_KEY generated on first start
# (saved to ./runtime/secret_key). Put overrides in .env (see .env.example).
#
# Two containers: MySQL, and the app. The app container runs the web server,
# the background job worker, and the retention cleanup loop together.
#
# The database defaults are fine for a local install because MySQL is only
# reachable on the Compose network and on 127.0.0.1. Set your own values in
# .env for a server.

services:
  mysql:
    image: mysql:8.0
    container_name: transcriber-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-transcriber-root}
      MYSQL_DATABASE: ${MYSQL_DB:-transcriber}
      MYSQL_USER: ${MYSQL_USER:-transcriber}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-transcriber}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      # Reachable from this machine only, on MYSQL_HOST_PORT (default 3307).
      # Set MYSQL_HOST_BIND=0.0.0.0 to expose it on the network.
      - "${MYSQL_HOST_BIND:-127.0.0.1}:${MYSQL_HOST_PORT:-3307}:3306"
    restart: unless-stopped
    healthcheck:
      # $$ defers expansion to the container, which has the resolved values.
      test: ["CMD-SHELL", "mysql -h localhost -u \"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" -e 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5

  transcriber:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: transcriber
    ports:
      - "${APP_PORT:-5004}:5004" # Expose app on APP_PORT (default 5004)
    volumes:
      - ./app:/app/app
      - ./tests:/app/tests
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - ./runtime:/app/runtime
    env_file:
      - path: .env
        required: false
    environment:
      # --- Core App Settings ---
      # Optional. When unset, a key is generated once and kept in ./runtime/secret_key.
      SECRET_KEY: ${SECRET_KEY:-}
      # Unset = switch personal/team mode in the app. Set 'single' or 'multi' to lock it.
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      TZ: ${TZ:-UTC}

      # --- API Keys (Global Fallbacks / Single-User Mode) ---
      ASSEMBLYAI_API_KEY: ${ASSEMBLYAI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}

      # --- Provider Configuration ---
      TRANSCRIPTION_PROVIDERS: ${TRANSCRIPTION_PROVIDERS:-assemblyai,openai,gemini,openrouter}
      DEFAULT_TRANSCRIPTION_PROVIDER: ${DEFAULT_TRANSCRIPTION_PROVIDER:-openai}
      DEFAULT_LLM_PROVIDER: ${DEFAULT_LLM_PROVIDER:-gemini}

      # --- Transcription Language Settings ---
      DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-auto}
      SUPPORTED_LANGUAGE_CODES: ${SUPPORTED_LANGUAGE_CODES:-en,nl,fr,es}

      # --- Database ---
      MYSQL_HOST: mysql # Service name defined above
      MYSQL_PORT: 3306 # Internal port for MySQL service
      MYSQL_USER: ${MYSQL_USER:-transcriber}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-transcriber}
      MYSQL_DB: ${MYSQL_DB:-transcriber}
      MYSQL_POOL_SIZE: ${MYSQL_POOL_SIZE:-10}

      # --- File Storage & Cleanup ---
      DELETE_THRESHOLD: ${DELETE_THRESHOLD:-86400} # 24 hours in seconds

      # --- Logging ---
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      # --- Runtime State / Markers ---
      # TASK_LOCK_FILE is defined in config.py using RUNTIME_DIR, no need to set here if using defaults

      # --- Security Settings ---
      BCRYPT_LOG_ROUNDS: ${BCRYPT_LOG_ROUNDS:-12}
      RATELIMIT_DEFAULT: ${RATELIMIT_DEFAULT:-600 per minute;10000 per day}

      # --- Admin User Credentials (for initial setup) ---
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-} # Optional. When set, sign-in is required and cannot be turned off in the app.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}

      # --- Email Configuration ---
      MAIL_SERVER: ${MAIL_SERVER:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USE_TLS: ${MAIL_USE_TLS:-true}
      MAIL_USE_SSL: ${MAIL_USE_SSL:-false}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_DEFAULT_SENDER: ${MAIL_DEFAULT_SENDER:-}
      MAIL_DEBUG: ${MAIL_DEBUG:-false}

      # --- OAuth Configuration ---
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}

      # --- Data Retention Configuration ---
      PHYSICAL_DELETION_DAYS: ${PHYSICAL_DELETION_DAYS:-120}

      # --- Workflow and Auxiliary LLM Defaults ---
      WORKFLOW_LLM_PROVIDER: ${WORKFLOW_LLM_PROVIDER:-OPENROUTER}
      WORKFLOW_LLM_MODEL: ${WORKFLOW_LLM_MODEL:-google/gemini-3.7-flash}
      TITLE_GENERATION_LLM_PROVIDER: ${TITLE_GENERATION_LLM_PROVIDER:-GEMINI}
      TITLE_GENERATION_LLM_MODEL: ${TITLE_GENERATION_LLM_MODEL:-gemma-4-26b-a4b-it}
      WORKFLOW_MAX_OUTPUT_TOKENS: ${WORKFLOW_MAX_OUTPUT_TOKENS:-1024}
      WORKFLOW_RATE_LIMIT: ${WORKFLOW_RATE_LIMIT:-10 per hour}
      DIRECT_LLM_RATE_LIMIT: ${DIRECT_LLM_RATE_LIMIT:-5 per hour}

      # --- Transcription Performance ---
      TRANSCRIPTION_MAX_CONCURRENT_JOBS: ${TRANSCRIPTION_MAX_CONCURRENT_JOBS:-2}
      TRANSCRIPTION_SLOT_POLL_SECONDS: ${TRANSCRIPTION_SLOT_POLL_SECONDS:-2}
      TRANSCRIPTION_ABANDONED_JOB_SECONDS: ${TRANSCRIPTION_ABANDONED_JOB_SECONDS:-300}
      TRANSCRIPTION_WORKERS: ${TRANSCRIPTION_WORKERS:-4}

    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      # The Alpine image has no curl; Python's urllib follows redirects (e.g. to /login).
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5004/', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  mysql_data: # Persist MySQL data

networks:
  default:
    # Fixed name so tests/docker-compose.test.yml can join it whatever the folder is called.
    name: transcriber_network
